name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # GitHub-hosted Ubuntu runners are x86_64, so the official SQL Server image runs natively
    # here (no Apple Silicon emulation quirks) — a real database for the integration tests below.
    services:
      db:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiPipeline123!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiPipeline123! -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore BookIt.slnx

      - name: Build
        run: dotnet build BookIt.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/BookIt.UnitTests/BookIt.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests
        env:
          Sql__Host: localhost
          Sql__Port: "1433"
          Sql__Database: BookIt_CI
          Sql__Password: "CiPipeline123!"
          Jwt__Secret: "ci-pipeline-signing-key-not-used-in-production-0123456789"
          Jwt__Issuer: BookIt.Api
          Jwt__Audience: BookIt.Client
        run: dotnet test tests/BookIt.IntegrationTests/BookIt.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Api image
        run: docker build -f src/BookIt.Api/Dockerfile -t bookit-api:ci .

      - name: Build Web image
        run: docker build -f src/BookIt.Web/Dockerfile -t bookit-web:ci .
